<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6b4f">
<title>KümesTakip</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KümesTakip">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: saha aracı — üstte deneme şeridi, ortada tek görünüm, telefonda altta sekme çubuğu; masaüstünde sekmeler üstte */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e9ede7; --line:#d3d9d0; --fg:#18211b; --muted:#56635a;
  --accent:#1f6b4f; --accent-fg:#ffffff; --accent-soft:#dcebe3;
  --at:#b07a00; --at-soft:#f7ecd0; --rs:#2a62b8; --rs-soft:#dde7f7;
  --ok:#2e7d3e; --warn:#a35f00; --bad:#b3261e; --warn-soft:#fbeed9; --bad-soft:#f9e1df;
  --body:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Noto Sans Mono",ui-monospace,Menlo,Consolas,monospace;
  --brand:"Noto Sans",system-ui,sans-serif;
  --r:8px;
  --sky:#e2ece6; --topbg:rgba(243,245,242,.9);
  --pattern:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201b; --sunk:#202a23; --line:#2f3b33; --fg:#e6ece7; --muted:#a2b0a6;
  --accent:#5fbf95; --accent-fg:#0c1510; --accent-soft:#1e3328;
  --at:#e7b23a; --at-soft:#3a2f14; --rs:#7aa7f0; --rs-soft:#1c2a42;
  --ok:#6cc27a; --warn:#e5a54a; --bad:#f08a80; --warn-soft:#3a2c14; --bad-soft:#3d1e1b; --sky:#14231b; --topbg:rgba(17,22,19,.9);
  --pattern:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201b; --sunk:#202a23; --line:#2f3b33; --fg:#e6ece7; --muted:#a2b0a6;
  --accent:#5fbf95; --accent-fg:#0c1510; --accent-soft:#1e3328;
  --at:#e7b23a; --at-soft:#3a2f14; --rs:#7aa7f0; --rs-soft:#1c2a42;
  --ok:#6cc27a; --warn:#e5a54a; --bad:#f08a80; --warn-soft:#3a2c14; --bad-soft:#3d1e1b; --sky:#14231b; --topbg:rgba(17,22,19,.9);
  --pattern:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
html{min-height:100%;background-color:var(--bg);background-image:radial-gradient(1100px 420px at 50% -140px,var(--sky),transparent 70%);background-repeat:no-repeat;background-attachment:fixed}
body{background:transparent;min-height:100vh}
body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:88px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--body);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:1.4rem} h3{font-size:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.wrap{max-width:1080px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--topbg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--brand);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.brand .mark{width:28px;height:28px;border-radius:8px;flex:0 0 auto;background:#1f6b4f url("icons/icon-192.png") center/cover;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.brand b{color:var(--accent);font-weight:700}
.trial{flex:1;min-width:0;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.ok i{background:var(--ok)} .chip.warn i{background:var(--warn)} .chip.bad i{background:var(--bad)}
.banner{margin-top:10px;padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--fg);font-size:.92rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs.ro{grid-template-columns:repeat(2,1fr)}
@media (min-width:860px){
  body{padding-bottom:24px}
  .tabs{position:static;display:flex;gap:4px;background:none;border:0;padding:0;margin-top:10px}
  .tabs button{flex-direction:row;gap:7px;font-size:.94rem;padding:8px 12px;border-radius:var(--r)}
  .tabs button svg{width:18px;height:18px}
  .tabs button[aria-current="page"]{background:var(--accent-soft)}
}

main{padding-block:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card > h3{margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.big{padding:16px 20px;font-size:1.08rem;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;justify-content:flex-end;gap:5px;font-size:.86rem;color:var(--muted);min-width:0}
label.f span.u{font-size:.8rem;color:var(--muted)}
input.i,select.i,textarea.i{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 10px;width:100%;color:var(--fg);font-size:1rem;min-height:42px}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent);outline:none}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
.calc{font-size:.92rem;padding:9px 10px;border-radius:6px;background:var(--sunk);color:var(--fg);font-variant-numeric:tabular-nums;align-self:end}
details.sec{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.sec > summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:700}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::after{content:"+";margin-left:auto;font-size:1.2rem;color:var(--muted)}
details.sec[open] > summary::after{content:"−"}
details.sec .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.sub{font-size:.92rem;font-weight:700;color:var(--fg);margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.sub:first-child{border-top:0;padding-top:0;margin-top:0}
.ref{font-size:.8rem;color:var(--muted)}

.tag{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:600;font-size:.95rem;padding:1px 8px;border-radius:5px;border:2px solid var(--muted);white-space:nowrap}
.tag.AT{border-color:var(--at);background:var(--at-soft)} .tag.RS{border-color:var(--rs);background:var(--rs-soft)}
.tag .pk{margin-left:6px;padding:0 5px;border-radius:4px;background:var(--surface);color:var(--fg);font-family:var(--body);font-size:.72em;font-weight:700;line-height:1.5;border:1px solid var(--line)}
.tag.xl .pk{display:none}
.penbig{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:1rem}
.tag.xl{align-self:flex-start;font-size:1.9rem;font-weight:700;padding:2px 14px;border-width:3px;border-radius:8px}
.pill{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:.9rem}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{font-weight:600;color:var(--muted);font-size:.82rem;background:var(--sunk);position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--accent-soft)}
table.t input.i,table.t select.i{padding:5px 7px;font-size:.92rem;min-width:70px;min-height:34px}
table.fe input.i{min-width:110px}

.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.kpi{padding:10px 12px;border-radius:var(--r);background:var(--sunk)}
.kpi .v{font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.8rem;color:var(--muted)}

.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.shot{flex:0 0 auto;width:132px;display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.shot .ph{width:132px;height:100px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.shot .ph img{width:100%;height:100%;object-fit:cover;display:block}
.shot b{color:var(--fg);font-variant-numeric:tabular-nums}

svg.chart text{fill:var(--muted);font-family:var(--body);font-size:12px}
svg.chart .grid line{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.pens{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pen{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:3px}
.pen.AT{border-top:4px solid var(--at)} .pen.RS{border-top:4px solid var(--rs)}
.pen .pn{font-size:1.1rem;font-weight:700}
.pen[aria-pressed="true"]{outline:2px solid var(--accent)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.25)}
@media (min-width:860px){.toast{bottom:24px}}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,16,12,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;padding:18px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.daybar{display:flex;gap:6px;flex-wrap:wrap}
.daybar button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-variant-numeric:tabular-nums;font-size:.9rem}
.daybar button.has{border-color:var(--accent);color:var(--accent)}
.daybar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.photoin{display:flex;gap:10px;flex-wrap:wrap}
.photoin .ph{width:150px;height:112px;border-radius:6px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--sunk);font-size:.82rem;color:var(--muted);text-align:center;padding:4px}
.photoin .ph img{width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-motion:no-preference){.btn,.tabs button{transition:background .15s,border-color .15s,color .15s}}

/* bağımsız sayfa temeli */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.top .btn{padding:5px 10px;font-size:.85rem}
/* canlı QR tarayıcı */
.scanner{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.scanner video{flex:1;width:100%;min-height:0;object-fit:cover}
.scan-frame{position:absolute;left:50%;top:42%;width:min(64vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.scan-bar{position:absolute;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:center;color:#fff;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.7))}
/* giriş ekranı */
.gate{min-height:70vh;display:grid;place-items:center;padding-block:24px}
.gate-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.gate-card .logo{font-family:var(--brand);font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.gate-card{overflow:hidden}
.gate-card .hero{margin:-24px -24px 4px;width:calc(100% + 48px);max-width:none;display:block}
.hero-band{display:block;width:100%;max-width:100%;border-radius:12px;border:1px solid var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero,:root:not([data-theme="light"]) .hero-band{filter:brightness(.82) saturate(.9)}}
:root[data-theme="dark"] .hero,:root[data-theme="dark"] .hero-band{filter:brightness(.82) saturate(.9)}
.gate-card .logo b{color:var(--accent)}
.gate-card .btn.big{min-height:56px}
/* ziyaretçi zaman çizelgesi */
.vlist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.vcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.vcard .ph{aspect-ratio:4/3;max-width:100%;border-radius:6px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.82rem}
.vcard .ph img{width:100%;height:100%;object-fit:cover}
.timeline{display:flex;flex-direction:column;gap:18px;position:relative}
.wk{display:grid;gap:12px;grid-template-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
@media (min-width:700px){.wk{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.wk-photo{aspect-ratio:4/3;max-width:100%;border-radius:8px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.wk-photo img{width:100%;height:100%;object-fit:cover;display:block}
.wk-side{width:110px;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--sunk)}
.wk-side img{width:100%;height:100%;object-fit:cover}
.wk-day{font-size:1.25rem;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.gain{color:var(--ok)}
@media (prefers-reduced-motion:no-preference){
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .wk,.vcard{animation:rise .32s ease-out both}
  @keyframes draw{to{stroke-dashoffset:0}}
  .hero .curve,.hero-band .curve{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s .15s cubic-bezier(.4,0,.2,1) forwards}
}
</style>
</head>
<body>

<header class="top wrap" lang="tr">
  <div class="brand"><span class="mark" aria-hidden="true"></span><span>Kümes<span style="color:var(--accent)">Takip</span></span></div>
  <div class="trial" aria-hidden="true"></div>
  <span class="chip" id="sync"><i></i><span>Bağlanıyor</span></span>
  <button class="btn ghost" id="exitBtn" hidden>Çıkış</button>
</header>
<div class="wrap" id="bannerBox" lang="tr"></div>
<nav class="tabs wrap" id="tabs" aria-label="Bölümler" lang="tr">
  <button data-v="okut"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>Okut</button>
  <button data-v="bireyler"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Bireyler</button>
  <button data-v="kumes"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>Kümes</button>
  <button data-v="et"><svg viewBox="0 0 24 24"><path d="M6 14c-2-4 1-9 6-9 4 0 7 3 7 7 0 5-5 8-9 7"/><path d="M6 14l-2 4 3 1 1 2 3-2"/></svg>Et kalitesi</button>
  <button data-v="rna"><svg viewBox="0 0 24 24"><path d="M7 3c0 6 10 6 10 12s-10 6-10 6M17 3c0 6-10 6-10 12s10 6 10 6"/><path d="M8 7h8M8 17h8"/></svg>RNA-seq</button>
  <button data-v="analiz"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analiz</button>
  <button data-v="ayar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2.1-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2.1 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2.1 1.2L10 21h4l.5-2.6a7 7 0 0 0 2.1-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>Ayarlar</button>
</nav>
<main class="wrap" id="main" lang="tr"></main>
<input type="file" id="fileScan" accept="image/*" capture="environment" hidden>
<input type="file" id="filePhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="fileAny" hidden>
<div id="toastBox" lang="tr"></div>
<div id="modalBox" lang="tr"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
"use strict";

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===null||v===undefined||v==="")return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const fmt=(v,d=0)=>v===null||v===undefined||!isFinite(v)?"—":Number(v).toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d});
const mean=a=>{a=a.filter(x=>x!=null&&isFinite(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const sd=a=>{a=a.filter(x=>x!=null&&isFinite(x));if(a.length<2)return null;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const median=a=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);if(!a.length)return null;const h=a.length>>1;return a.length%2?a[h]:(a[h-1]+a[h])/2};
const isObj=o=>o&&typeof o==="object"&&!Array.isArray(o);
function deepMerge(t,s){for(const k in s){if(isObj(s[k])){if(!isObj(t[k]))t[k]={};deepMerge(t[k],s[k])}else t[k]=s[k]}return t}

/* ============ IndexedDB (yerel fotoğraf + bekleyenler) ============ */
const IDB={db:null,
  open(){return new Promise(r=>{try{const q=indexedDB.open("pilictakip",1);q.onupgradeneeded=()=>{q.result.createObjectStore("blobs")};q.onsuccess=()=>{this.db=q.result;r(true)};q.onerror=()=>r(false)}catch(e){r(false)}})},
  put(k,v){return new Promise(r=>{try{if(!this.db)return r(false);const tx=this.db.transaction("blobs","readwrite");tx.objectStore("blobs").put(v,k);tx.oncomplete=()=>r(true);tx.onerror=()=>r(false)}catch(e){r(false)}})},
  get(k){return new Promise(r=>{try{if(!this.db)return r(null);const q=this.db.transaction("blobs").objectStore("blobs").get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})},
  del(k){return new Promise(r=>{try{if(!this.db)return r(false);const tx=this.db.transaction("blobs","readwrite");tx.objectStore("blobs").delete(k);tx.oncomplete=()=>r(true)}catch(e){r(false)}})}
};

const ST={mode:"init",birds:{},pens:{},config:clone(CONFIG_DEFAULT),rna:{},canWrite:true,view:"okut",cur:null,curDay:null,curSec:null,penSel:1,filter:{g:"",p:"",q:"",s:""},pending:ls("pt_queue")||[],pendingRender:false,loaded:false,want:null,role:null,session:null};

let sb=null,DL=null;
const BUCKET="fotograflar";

const Store={
  async init(){
    await IDB.open();
    if(SB_READY){
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
      ST.mode="db";
      try{const {data}=await sb.auth.getSession();ST.session=data.session||null}catch(e){}
      ST.pdocs=(await IDB.get("pdocs"))||{};
      const cached=await IDB.get("cache");if(cached){this.apply(cached);ST.cachedAt=cached.at;ST.loaded=true;render()}
      await this.load();
      document.addEventListener("visibilitychange",()=>{if(!document.hidden)this.load()});
      setInterval(()=>{if(!document.hidden)this.load()},60000);
    }else{
      ST.mode="local";const d=ls("pt_local");if(d){ST.birds=d.birds||{};ST.pens=d.pens||{};ST.config=deepMerge(clone(CONFIG_DEFAULT),d.config||{});ST.rna=d.rna||{}}ST.loaded=true;
    }
    syncChip();tryWanted();render();
    setInterval(()=>this.flush(),20000);
    window.addEventListener("online",()=>{syncChip();this.flush()});
    window.addEventListener("offline",()=>syncChip());
  },
  /* tüm kayıtları okur; telefonda bekleyen yazımlar korunur */
  async load(){
    if(!sb||ST.mode==="demo")return;
    let rows=[];
    for(let from=0;;from+=1000){
      const {data,error}=await sb.from("kayitlar").select("path,data").range(from,from+999);
      if(error){ST.offline=true;syncChip();return}
      rows=rows.concat(data||[]);if(!data||data.length<1000)break;
    }
    const snap={birds:{},pens:{},cfg:{},rna:{},at:new Date().toISOString()};
    rows.forEach(r=>{const [c,id]=r.path.split("/");if(c==="birds")snap.birds[id]=r.data;else if(c==="pens")snap.pens[id]=r.data;else if(r.path==="config/main")snap.cfg=r.data;else if(r.path==="rna/deg")snap.rna=r.data});
    IDB.put("cache",snap);ST.cachedAt=snap.at;ST.offline=false;
    this.apply(snap);
    ST.loaded=true;syncChip();tryWanted();softRender();
  },
  /* sunucudan ya da telefondaki son kopyadan gelen kayıtları yükler; gönderilmeyi bekleyenler üstte kalır */
  apply(snap){
    const birds=clone(snap.birds),pens=clone(snap.pens);let cfg=clone(snap.cfg),rna=clone(snap.rna);
    for(const [path,doc] of Object.entries(ST.pdocs||{})){const [c,id]=path.split("/");if(c==="birds")birds[id]=clone(doc);else if(c==="pens")pens[id]=clone(doc);else if(path==="config/main")cfg=clone(doc);else if(path==="rna/deg")rna=clone(doc)}
    ST.birds=birds;ST.pens=pens;ST.config=deepMerge(clone(CONFIG_DEFAULT),cfg||{});ST.rna=rna||{};
  },
  saveLocal(){if(ST.mode==="local")ls("pt_local",{birds:ST.birds,pens:ST.pens,config:ST.config,rna:ST.rna})},
  target(path){const [col,id]=path.split("/");if(col==="birds")return [ST.birds,id];if(col==="pens")return [ST.pens,id];return [null,null]},
  full(path){const [t,id]=this.target(path);return t?t[id]:path==="config/main"?ST.config:ST.rna},
  async write(path){
    const {error}=await sb.from("kayitlar").upsert({path,data:clone(this.full(path)),updated_at:new Date().toISOString()});
    if(error)throw error;
  },
  async patch(path,patch,whole=false){
    if(!ST.canWrite){toast("Kayıt girmek için kullanıcı olarak giriş yap");return false}
    const [t,id]=this.target(path);
    if(t){if(whole||!t[id])t[id]={};deepMerge(t[id],clone(patch))}
    else if(path==="config/main")deepMerge(ST.config,clone(patch));
    else if(path==="rna/deg")deepMerge(ST.rna,clone(patch));
    if(ST.mode==="demo")return true;
    if(ST.mode==="local"){this.saveLocal();return true}
    try{await this.write(path);return true}
    catch(e){
      if(e&&(e.code==="42501"||/row-level security|JWT|permission/i.test(e.message||""))){toast("Kayıt izni yok; yeniden giriş yap",5000);return false}
      this.enqueue(path);syncChip();toast("Bağlantı yok: kayıt telefonda bekletiliyor");return true;
    }
  },
  async remove(path){
    const [t,id]=this.target(path);if(t)delete t[id];
    if(ST.mode==="local"){this.saveLocal();return true}
    if(ST.mode==="demo")return true;
    const {error}=await sb.from("kayitlar").delete().eq("path",path);
    if(error){toast("Silinemedi: "+error.message);return false}return true;
  },
  async bulkSet(col,obj){
    const t=col==="birds"?ST.birds:ST.pens;Object.assign(t,clone(obj));
    if(ST.mode!=="db"){this.saveLocal();return}
    const ids=Object.keys(obj);
    for(let i=0;i<ids.length;i+=100){
      const chunk=ids.slice(i,i+100).map(id=>({path:col+"/"+id,data:clone(obj[id]),updated_at:new Date().toISOString()}));
      const {error}=await sb.from("kayitlar").upsert(chunk);
      if(error)ids.slice(i,i+100).forEach(id=>this.enqueue(col+"/"+id));
      syncChip("warn",`Kaydediliyor ${Math.min(i+100,ids.length)}/${ids.length}`);
    }
    syncChip();
  },
  enqueue(path){if(!ST.pending.includes(path))ST.pending.push(path);ls("pt_queue",ST.pending);ST.pdocs=ST.pdocs||{};ST.pdocs[path]=clone(this.full(path));IDB.put("pdocs",ST.pdocs)},
  async flush(){
    if(ST.mode!=="db"||!ST.canWrite||this.busy)return;this.busy=true;
    try{
      if(ST.pending.length){const left=[];for(const path of ST.pending){if(!this.full(path)){delete ST.pdocs?.[path];continue}try{await this.write(path);delete ST.pdocs?.[path]}catch(e){left.push(path)}}ST.pending=left;ls("pt_queue",left);IDB.put("pdocs",ST.pdocs||{});if(!left.length)toast("Bekleyen kayıtlar gönderildi")}
      for(const b of Object.values(ST.birds))for(const [dk,w] of Object.entries(b.weeks||{}))for(const slot of ["top","side"]){
        const ref=w[slot];if(typeof ref!=="string"||!ref.startsWith("pend:"))continue;
        const blob=await IDB.get(ref);if(!blob)continue;
        try{const r=await this.putFile(blob,`${b.id}/${dk}_${slot}_${uid()}.jpg`,"image/jpeg");await this.patch("birds/"+b.id,{weeks:{[dk]:{[slot]:r}}});IDB.del(ref)}catch(e){}
      }
    }finally{this.busy=false;syncChip()}
  },
  async putFile(blob,path,type){
    const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:type,upsert:false});
    if(error)throw error;return "sb:"+path;
  },
  async putPhoto(blob,hint){
    if(ST.mode==="db"){
      try{return await this.putFile(blob,`${hint||"genel"}/${uid()}.jpg`,"image/jpeg")}
      catch(e){const k="pend:"+uid();await IDB.put(k,blob);toast("Fotoğraf telefonda bekletiliyor; bağlantı gelince yüklenecek");return k}
    }
    if(ST.mode==="demo")return "mem:"+URL.createObjectURL(blob);
    const k="local:"+uid();await IDB.put(k,blob);return k;
  }
};

  ST.role=null;ST.canWrite=false;ST.cur=null;ST.curPen=null;ST.view="okut";render();window.scrollTo(0,0);

function syncChip(kind,text){
  const c=$("#sync");
  if(!kind){
    if(ST.mode==="demo"){kind="warn";text="Örnek veri"}
    else if(ST.mode==="local"){kind="warn";text="Yalnızca bu cihaz"}
    else if(ST.mode==="init"){kind="";text="Bağlanıyor"}
    else if(ST.pending.length){kind="warn";text=`${ST.pending.length} kayıt bekliyor`}
    else if(!navigator.onLine||ST.offline){kind="bad";text=ST.cachedAt?`Çevrimdışı · ${new Date(ST.cachedAt).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})} kopyası`:"Çevrimdışı"}
    else if(!ST.loaded){kind="";text="Yükleniyor"}
    else{kind="ok";text=ST.canWrite?"Eşitlendi":"Görüntüleme"}
  }
  c.className="chip "+kind;c.querySelector("span").textContent=text;

}

const urlCache={};
function photoSrc(ref){
  if(!ref)return "";
  if(ref.startsWith("demo:"))return demoPhoto(ref);
  if(ref.startsWith("mem:"))return ref.slice(4);
  if(ref.startsWith("sb:"))return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${ref.slice(3).split("/").map(encodeURIComponent).join("/")}`;
  if(ref.startsWith("local:")||ref.startsWith("pend:")){
    if(urlCache[ref])return urlCache[ref];
    IDB.get(ref).then(b=>{if(!b)return;urlCache[ref]=URL.createObjectURL(b);document.querySelectorAll(`img[data-ref="${CSS.escape(ref)}"]`).forEach(i=>i.src=urlCache[ref])});
    return "";
  }

}
const imgTag=(ref,alt)=>ref?`<img data-ref="${esc(ref)}" src="${esc(photoSrc(ref))}" alt="${esc(alt)}" loading="lazy">`:"";
function readImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error("Görüntü okunamadı"));im.src=u})}
async function compress(file,max=1600){
  const im=await readImage(file);const s=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.86));
  return {blob,canvas:c};
}
async function decodeQR(canvas){
  await loadScript(LIB.jsqr);
  for(const sc of [1,0.6,1.6]){
    const w=Math.round(Math.min(1400,canvas.width*sc)),h=Math.round(canvas.height*w/canvas.width);
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(canvas,0,0,w,h);
    const d=x.getImageData(0,0,w,h);const r=window.jsQR(d.data,w,h,{inversionAttempts:"attemptBoth"});
    if(r&&r.data)return parseQR(r.data);
  }
  return null;
}
function parseQR(s){s=String(s).trim();const h=s.lastIndexOf("#");if(h>=0)s=s.slice(h+1);try{s=decodeURIComponent(s)}catch(e){}return normId(s)}
function pickFile(input,accept){return new Promise(res=>{const el=$(input);if(accept)el.accept=accept;el.value="";el.onchange=()=>res(el.files[0]||null);el.click()})}

function qrObj(t){const q=qrcode(0,ST.config.qrMode==="url"?"M":"H");q.addData(t);q.make();return q}
function qrSVG(t){const q=qrObj(t),n=q.getModuleCount();let p="";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c},${r}h1v1h-1z`;return `<svg viewBox="-4 -4 ${n+8} ${n+8}" width="100%" shape-rendering="crispEdges"><rect x="-4" y="-4" width="${n+8}" height="${n+8}" fill="#fff"/><path d="${p}" fill="#000"/></svg>`}

function alive(b,d){return !(b.status==="öldü"&&b.deathDay!=null&&num(b.deathDay)<=d)}
function penBirds(p){return birdList().filter(b=>String(b.pen)===String(p))}
function penGeno(p){const bs=penBirds(p);if(!bs.length)return ST.pens["B"+p]?.geno||"";const c={};bs.forEach(b=>c[b.geno]=(c[b.geno]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]}
function penIds(){const n=Number(ST.config.penCount)||6;const s=new Set();for(let i=1;i<=n;i++)s.add(i);birdList().forEach(b=>num(b.pen)&&s.add(Number(b.pen)));return [...s].sort((a,b)=>a-b)}
function penStats(p){
  const ds=days(),bs=penBirds(p),pen=ST.pens["B"+p]||{},out=[];
  let cumFeed=0,cumDead=0,prevBio=null,bio0=null;
  ds.forEach((d,i)=>{
    const ws=bs.map(b=>wOf(b,d)).filter(x=>x!=null);
    const bio=ws.length?ws.reduce((s,x)=>s+x,0):null;
    if(i===0)bio0=bio;
    const prev=i?ds[i-1]:null;
    const deadBirds=bs.filter(b=>b.status==="öldü"&&num(b.deathDay)!=null&&num(b.deathDay)<=d&&(prev===null||num(b.deathDay)>prev));
    const deadW=deadBirds.reduce((s,b)=>s+(num(b.deathW)||0),0);
    const wk=pen.weeks?.["d"+d]||{};
    const feed=num(wk.feed)!=null?(num(wk.feed)-(num(wk.left)||0))*1000:null;
    let fcr=null,cfcr=null;
    if(feed!=null)cumFeed+=feed;
    cumDead+=deadW;
    if(i>0&&feed!=null&&bio!=null&&prevBio!=null){const gain=bio-prevBio+deadW;if(gain>0)fcr=feed/gain}
    if(i>0&&bio!=null&&bio0!=null&&cumFeed>0){const g=bio-bio0+cumDead;if(g>0)cfcr=cumFeed/g}
    const m=mean(ws),s=sd(ws);
    out.push({d,n:ws.length,alive:bs.filter(b=>alive(b,d)).length,mean:m,cv:m&&s?s/m*100:null,bio,feed,deadN:deadBirds.length,deadW,fcr,cfcr,wk});
    if(bio!=null)prevBio=bio;
  });
  out.forEach((r,i)=>{if(i>0&&r.mean!=null&&out[i-1].mean!=null)r.adg=(r.mean-out[i-1].mean)/(r.d-out[i-1].d)});
  return out;
}

function sCalc(s){

  return {yield:f&&h?h/f*100:null,breast:h&&pM!=null?((pM||0)+(pm||0))/h*100:null,thigh:h&&tR!=null?((tR||0)+(tL||0))/h*100:null,fat:f&&af!=null?af/f*100:null};
}
function mCalc(m){const d1=num(m?.dm1),d2=num(m?.dm2),c1=num(m?.cm1),c2=num(m?.cm2);return {drip:d1&&d2!=null?(d1-d2)/d1*100:null,cook:c1&&c2!=null?(c1-c2)/c1*100:null}}

function lineChart({series,w,h=240,yLabel="g",xs}){
  if(!w){const mw=($("#main")?.clientWidth||680)-34;w=Math.max(300,Math.min(760,mw));h=w<500?210:250}
  const pad={l:54,r:16,t:16,b:30};
  const xsA=xs||days();const xmin=Math.min(...xsA),xmax=Math.max(...xsA);
  let ymax=0;series.forEach(s=>s.pts.forEach(p=>{if(p[1]!=null)ymax=Math.max(ymax,p[1])}));
  if(!ymax)ymax=100;
  const step=niceStep(ymax/4);ymax=Math.ceil(ymax/step)*step;
  const X=x=>pad.l+(x-xmin)/(xmax-xmin||1)*(w-pad.l-pad.r),Y=y=>h-pad.b-(y/ymax)*(h-pad.t-pad.b);
  let g=`<g class="grid">`;for(let v=0;v<=ymax+1e-9;v+=step)g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pad.l-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  xsA.forEach(x=>g+=`<text x="${X(x)}" y="${h-9}" text-anchor="middle">${x}</text>`);
  g+=`<text x="6" y="11" style="font-size:11px">${esc(yLabel)}</text></g>`;
  let body="";
  series.forEach(s=>{
    const pts=s.pts.filter(p=>p[1]!=null);if(!pts.length)return;
    const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");
    body+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.wd||2}" ${s.dash?`stroke-dasharray="${s.dash}"`:""}/>`;
    if(s.dots||pts.length===1)pts.forEach((p,i)=>body+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${i===pts.length-1?4.5:3}" fill="${s.color}"><title>${p[0]}. gün: ${fmt(p[1])} ${yLabel}</title></circle>`);
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Büyüme eğrisi">${g}${body}</svg>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const m=x/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}

/* Canlı tarayıcı: Android'de yerleşik BarcodeDetector, diğerlerinde jsQR; kamera açılamazsa fotoğrafla okumaya düşer */
let scanStop=null;
async function liveScan(sec){
  if(!navigator.mediaDevices?.getUserMedia)return scanPhoto(sec);
  if(scanStop)scanStop();
  const m=$("#modalBox");
  m.innerHTML=`<div class="scanner" role="dialog" aria-label="QR tarayıcı"><video id="scV" playsinline muted autoplay></video><div class="scan-frame" aria-hidden="true"></div>
    <div class="scan-bar"><span id="scMsg">QR'ı çerçeveye getir</span><div class="row" style="justify-content:center"><button class="btn" id="scPhoto">Fotoğrafla oku</button><button class="btn" id="scClose">Kapat</button></div></div></div>`;
  let stream=null,stopped=false;
  const close=()=>{stopped=true;scanStop=null;try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}if($("#modalBox .scanner"))m.innerHTML=""};
  scanStop=close;
  $("#scClose").onclick=close;$("#scPhoto").onclick=()=>{close();scanPhoto(sec)};
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){close();toast("Kamera açılamadı; etiketin fotoğrafını çekerek oku",4000);return scanPhoto(sec)}
  if(stopped){stream.getTracks().forEach(t=>t.stop());return}
  const v=$("#scV");v.srcObject=stream;try{await v.play()}catch(e){}
  let det=null;
  try{if("BarcodeDetector" in window){const f=await BarcodeDetector.getSupportedFormats();if(f.includes("qr_code"))det=new BarcodeDetector({formats:["qr_code"]})}}catch(e){det=null}
  if(!det){try{await loadScript(LIB.jsqr)}catch(e){}}
  const c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});
  let last="";
  const tick=async()=>{
    if(stopped)return;
    if(v.readyState>=2&&v.videoWidth){
      let txt=null;
      try{
        if(det){const r=await det.detect(v);if(r&&r[0])txt=r[0].rawValue}
        else if(window.jsQR){const w=720,h=Math.round(v.videoHeight*w/v.videoWidth);c.width=w;c.height=h;x.drawImage(v,0,0,w,h);const r=window.jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"attemptBoth"});if(r)txt=r.data}
      }catch(e){}
      if(txt){const id=parseQR(txt);
        if(ST.birds[id]||penOfId(id)){try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}close();openBird(id,sec);toast((penOfId(id)?"Kümes "+penOfId(id):id)+" açıldı");return}
        if(id!==last){last=id;const el=$("#scMsg");if(el)el.textContent=`${id} bu denemede yok`}}
    }
    setTimeout(tick,det?100:160);
  };
  tick();
}

function roSections(b){

  const c=sCalc(b.slaughter),m=mCalc(b.meat);

    +part("Et kalitesi",FON("meat"),b.meat,[["Drip loss (%)",m.drip],["Cooking loss (%)",m.cook]]);
}

  $("#w_w").oninput=()=>{const w=num(val("w_w")),e=expectedW(b,d);const box=$("#wWarn");box.innerHTML=w!=null&&e&&Math.abs(w-e)/e>0.25?`<div class="banner" style="margin:0">${fmt(w)} g, beklenen ≈ ${fmt(e)} g değerinden %${fmt(Math.abs(w-e)/e*100)} sapıyor. Doğru birey ve doğru değer mi?</div>`:""};

        else{const seg=segmentBird(canvas),a=areaCm2(seg);pendSeg=a?{area:Math.round(a*10)/10,areaPx:Math.round(seg.px)}:null;
          const pw=a?predictW(b.geno,a):null;

      }
      const qid=await decodeQR(canvas).catch(()=>null);
      if(qid&&qid!==id)dlg(`<h3>Etiket uyuşmuyor</h3><p>Fotoğraftaki QR <b class="mono">${esc(qid)}</b>, açık kart <b class="mono">${esc(id)}</b>. Yanlış birey olabilir; kaydetmeden önce kontrol et.</p>`,null);
      else if(qid===id)toast("Fotoğraftaki etiket doğrulandı: "+id);
    }catch(e){box.textContent=e.message}
  }});
  const saveWeek=async next=>{

      FON("weekly").forEach(m=>{const v=val("x_"+m.k);if(v!==undefined)patch[m.k]=ftype(m)==="num"?(v===""?"":String(num(v)??v)):v});

    if(await Store.patch("birds/"+id,{rna:$("#r_flag").checked,rnaseq:o})){clearDirty("rna");toast("RNA-seq verisi kaydedildi");ST.curSec="rna";render()}
  };
}

function qpcrSummary(rb){
  const by={};rb.forEach(b=>(b.rnaseq?.qpcr||[]).forEach(x=>{const ct=num(x.ct),rf=num(x.ref);if(!x.gene||ct==null||rf==null)return;const g=up(x.gene);by[g]=by[g]||{};(by[g][b.geno]=by[g][b.geno]||[]).push(ct-rf)}));
  const c=ST.config.ctrl,gs=Object.keys(G()),o=gs.find(g=>g!==c);
  return Object.entries(by).map(([gene,v])=>{const d={},n={};gs.forEach(g=>{d[g]=mean(v[g]||[]);n[g]=(v[g]||[]).length});const dd=d[o]!=null&&d[c]!=null?d[o]-d[c]:null;return {gene,d,n,dd,fc:dd!=null?Math.pow(2,-dd):null}});
}
function parseCSV(t){
  t=t.replace(/^﻿/,"");const first=t.split("\n")[0];const sep=first.includes("\t")?"\t":first.includes(";")&&!first.includes(",")?";":",";
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===sep){r.push(f);f=""}else if(c==="\n"){r.push(f);rows.push(r);r=[];f=""}else if(c!=="\r")f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows;
}
function degFromText(t){
  const rows=parseCSV(t);if(rows.length<2)return {error:"Dosyada satır yok"};const h=rows[0].map(x=>x.trim().toLowerCase());
  const ix=n=>h.findIndex(x=>n.includes(x));
  const gi=Math.max(0,ix(["gene","symbol","gene_name","genename","external_gene_name","gen",""]));
  const li=ix(["log2foldchange","log2fc","logfc"]),pi=ix(["padj","fdr","qvalue","adj.p.val"]);
  if(li<0||pi<0)return {error:"log2FoldChange ve padj sütunları bulunamadı"};
  return rows.slice(1).map(r=>({g:(r[gi]||"").trim(),l:num(r[li]),p:num(r[pi])})).filter(x=>x.g&&x.l!=null);
}
function degHTML(d){
  if(!d)return "";if(d.error)return `<div class="banner">${esc(d.error)}</div>`;
  const sig=d.filter(x=>x.p!=null&&x.p<0.05&&Math.abs(x.l)>=1),upN=sig.filter(x=>x.l>0).length,dn=sig.length-upN;
  const cand=candList(),cmap={};d.forEach(x=>{const k=up(x.g);if(cand.includes(k))cmap[k]=x});
  const w=Math.max(300,Math.min(700,($("#main")?.clientWidth||680)-34)),h=300,pad={l:44,r:12,t:12,b:32};
  const xm=Math.max(2,...d.map(x=>Math.abs(x.l)).filter(isFinite).sort((a,b)=>b-a).slice(0,5));
  const yv=x=>x.p==null?0:Math.min(60,-Math.log10(Math.max(x.p,1e-300)));const ym=Math.max(5,...d.map(yv));
  const X=v=>pad.l+(v+xm)/(2*xm)*(w-pad.l-pad.r),Y=v=>h-pad.b-v/ym*(h-pad.t-pad.b);
  const sigSet=new Set(sig);const ns=d.filter(x=>!sigSet.has(x));const sample=ns.length>3000?ns.filter((_,i)=>i%Math.ceil(ns.length/3000)===0):ns;
  const mut=cssv("--line"),upc=cssv("--bad"),dnc=cssv("--accent"),ac=cssv("--fg");
  let s=`<g class="grid"><line x1="${X(-1)}" x2="${X(-1)}" y1="${pad.t}" y2="${h-pad.b}" stroke-dasharray="3 3"/><line x1="${X(1)}" x2="${X(1)}" y1="${pad.t}" y2="${h-pad.b}" stroke-dasharray="3 3"/><line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(-Math.log10(0.05))}" y2="${Y(-Math.log10(0.05))}" stroke-dasharray="3 3"/></g>`;
  sample.forEach(x=>s+=`<circle cx="${X(x.l).toFixed(1)}" cy="${Y(yv(x)).toFixed(1)}" r="1.6" fill="${mut}"/>`);
  sig.forEach(x=>s+=`<circle cx="${X(x.l).toFixed(1)}" cy="${Y(yv(x)).toFixed(1)}" r="2.2" fill="${x.l>0?upc:dnc}" fill-opacity=".75"/>`);
  Object.values(cmap).forEach(x=>s+=`<circle cx="${X(x.l)}" cy="${Y(yv(x))}" r="4" fill="none" stroke="${ac}" stroke-width="1.5"/><text x="${X(x.l)+6}" y="${Y(yv(x))-4}" style="fill:${ac};font-size:11px">${esc(x.g)}</text>`);
  for(let v=-Math.floor(xm);v<=xm;v+=Math.max(1,Math.round(xm/4)))s+=`<text x="${X(v)}" y="${h-12}" text-anchor="middle">${v}</text>`;
  s+=`<text x="${w-pad.r}" y="${h-12}" text-anchor="end" style="font-size:11px">log2FC</text><text x="6" y="${pad.t+8}" style="font-size:11px">−log10 padj</text>`;
  const other=gname(Object.keys(G()).find(g=>g!==ST.config.ctrl));
  return `<div class="kpis"><div class="kpi"><div class="v">${fmt(d.length)}</div><div class="l">test edilen gen</div></div><div class="kpi"><div class="v" style="color:var(--bad)">${fmt(upN)}</div><div class="l">artan (${esc(other)} yönünde)</div></div><div class="kpi"><div class="v" style="color:var(--accent)">${fmt(dn)}</div><div class="l">azalan</div></div></div>
  <svg class="chart" viewBox="0 0 ${w} ${h}" width="100%">${s}</svg>
  <p class="ref">Yön, DESeq2 kontrastına bağlıdır; <span class="mono">results(dds, contrast=c("genotip","RS","AT"))</span> gibi kontrastı kendin doğrula.</p>
  <div class="tablewrap"><table class="t"><thead><tr><th>Aday gen</th><th class="n">log2FC</th><th class="n">padj</th><th>Durum</th></tr></thead><tbody>${cand.map(c=>{const x=cmap[c];return `<tr><td class="mono">${esc(c)}</td><td class="n">${x?fmt(x.l,2):"—"}</td><td class="n">${x&&x.p!=null?x.p.toExponential(2):"—"}</td><td>${!x?`<span class="pill">tabloda yok</span>`:x.p!=null&&x.p<0.05&&Math.abs(x.l)>=1?`<span class="pill ${x.l>0?"bad":"ok"}">${x.l>0?"artan":"azalan"}</span>`:`<span class="pill">anlamsız</span>`}</td></tr>`}).join("")}</tbody></table></div>`;
}

function suggestRna(){
  const gs=Object.keys(G()),last=days().slice(-1)[0],pick=[];
  gs.forEach(g=>{
    const pool=birdList().filter(b=>b.geno===g&&b.sex==="erkek"&&b.status!=="öldü").map(b=>({b,w:num(b.slaughter?.fastedW)??wOf(b,last)})).filter(x=>x.w!=null);
    const md=median(pool.map(x=>x.w));pool.sort((a,b)=>Math.abs(a.w-md)-Math.abs(b.w-md));
    const used=new Set(),sel=[];
    for(const x of pool){if(sel.length>=4)break;if(!used.has(x.b.pen)){sel.push(x);used.add(x.b.pen)}}
    for(const x of pool){if(sel.length>=4)break;if(!sel.includes(x))sel.push(x)}
    pick.push({g,md,sel});
  });
  const any=pick.some(p=>p.sel.length);
  dlg(`<h3>Önerilen RNA-seq bireyleri</h3>${any?pick.map(p=>`<p><b>${esc(gname(p.g))}</b>, medyan ${fmt(p.md)} g<br>${p.sel.map(x=>`<span class="tag ${esc(p.g)}">${esc(x.b.id)}${pk(x.b)}</span> <span class="small muted">${fmt(x.w)} g · Kümes ${esc(x.b.pen)}</span>`).join("<br>")}</p>`).join(""):`<p class="muted">Cinsiyeti "erkek" girilmiş ve son günü tartılmış birey yok.</p>`}`,
  any?async()=>{for(const p of pick)for(const x of p.sel)await Store.patch("birds/"+x.b.id,{rna:true});toast("RNA-seq bireyleri işaretlendi");render()}:null,"Bu bireyleri işaretle");
}

function solve3(M,v){const a=M.map((r,i)=>[...r,v[i]]);for(let i=0;i<3;i++){let p=i;for(let j=i+1;j<3;j++)if(Math.abs(a[j][i])>Math.abs(a[p][i]))p=j;[a[i],a[p]]=[a[p],a[i]];if(Math.abs(a[i][i])<1e-12)return null;for(let j=0;j<3;j++){if(j===i)continue;const f=a[j][i]/a[i][i];for(let c=i;c<4;c++)a[j][c]-=f*a[i][c]}}return [a[0][3]/a[0][0],a[1][3]/a[1][1],a[2][3]/a[2][2]]}

  const ys=pts.map(p=>p[1]),maxW=Math.max(...ys),ym=mean(ys),sst=ys.reduce((s,y)=>s+(y-ym)**2,0);

  const sse=p=>pts.reduce((s,[t,y])=>s+(y-gomp(p,t))**2,0);
  let best=null;
  for(const [fa,k0,t0] of [[2,0.04,35],[3,0.03,45],[1.4,0.06,28],[5,0.025,60]]){
    let p=clampP([maxW*fa,k0,t0]),lam=1e-2,cur=sse(p);
    for(let it=0;it<250;it++){
      const JTJ=[[0,0,0],[0,0,0],[0,0,0]],JTr=[0,0,0];
      for(const [t,y] of pts){const e=Math.exp(-p[1]*(t-p[2])),g=Math.exp(-e),J=[g,p[0]*g*e*(t-p[2]),-p[0]*g*e*p[1]],r=y-p[0]*g;for(let i=0;i<3;i++){JTr[i]+=J[i]*r;for(let j=0;j<3;j++)JTJ[i][j]+=J[i]*J[j]}}

      const np=clampP([p[0]+d[0],p[1]+d[1],p[2]+d[2]]),ns=sse(np);

}

/* Arka plan, kenar şeridinin medyan rengidir; ondan renkçe uzak pikseller Otsu eşiğiyle ayrılır, ortadaki en büyük leke birey kabul edilir. */
function segmentBird(canvas){
  const W=canvas.width,H=canvas.height,s=Math.min(1,500/Math.max(W,H)),w=Math.round(W*s),h=Math.round(H*s),N=w*h;
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(canvas,0,0,w,h);
  const img=x.getImageData(0,0,w,h),d=img.data;
  const band=Math.max(2,Math.round(Math.min(w,h)*0.04)),R=[],Gc=[],B=[];
  for(let y=0;y<h;y++)for(let i=0;i<w;i++){if(y>=band&&y<h-band&&i>=band&&i<w-band)continue;const o=(y*w+i)*4;R.push(d[o]);Gc.push(d[o+1]);B.push(d[o+2])}
  const br=median(R),bgc=median(Gc),bb=median(B);
  const dist=new Uint8Array(N),hist=new Array(256).fill(0);
  for(let i=0;i<N;i++){const o=i*4,v=Math.min(255,Math.round(Math.hypot(d[o]-br,d[o+1]-bgc,d[o+2]-bb)/1.733));dist[i]=v;hist[v]++}

  for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=N-wB;if(!wF)break;sB+=i*hist[i];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)**2;if(v>bestV){bestV=v;thr=i}}

    if(dist[i]<=thr||lab[i]!==-1)continue;
    let qh=0,qt=0,n=0,edge=0,sx=0,sy=0;q[qt++]=i;lab[i]=comps.length;
    while(qh<qt){const p=q[qh++],px=p%w,py=(p/w)|0;n++;sx+=px;sy+=py;if(px===0||py===0||px===w-1||py===h-1)edge++;
      if(px>0){const nb=p-1;if(lab[nb]===-1&&dist[nb]>thr){lab[nb]=comps.length;q[qt++]=nb}}
      if(px<w-1){const nb=p+1;if(lab[nb]===-1&&dist[nb]>thr){lab[nb]=comps.length;q[qt++]=nb}}
      if(py>0){const nb=p-w;if(lab[nb]===-1&&dist[nb]>thr){lab[nb]=comps.length;q[qt++]=nb}}
      if(py<h-1){const nb=p+w;if(lab[nb]===-1&&dist[nb]>thr){lab[nb]=comps.length;q[qt++]=nb}}}
    comps.push({n,edge,cx:sx/n/w,cy:sy/n/h});
  }
  let bi=-1,bs=-1;
  comps.forEach((k,i)=>{if(k.n<N*0.003)return;const cen=1-Math.min(1,Math.hypot(k.cx-.5,k.cy-.5)*1.6);const sc=k.n*(k.edge>k.n*0.02?0.15:1)*(0.5+cen);if(sc>bs){bs=sc;bi=i}});
  if(bi<0)return null;
  for(let i=0;i<N;i++){const o=i*4;if(lab[i]===bi){d[o]=Math.min(255,d[o]*0.4+150);d[o+1]=d[o+1]*0.5;d[o+2]=d[o+2]*0.4}else{d[o]*=0.3;d[o+1]*=0.3;d[o+2]*=0.3}}
  x.putImageData(img,0,0);
  return {px:comps[bi].n/(s*s),share:comps[bi].n/N,preview:c.toDataURL("image/jpeg",0.7),longSide:Math.max(W,H)};
}

  groups.forEach(g=>{g.pts.forEach(([x,y])=>s+=`<circle cx="${X(x).toFixed(1)}" cy="${Y(y).toFixed(1)}" r="2.6" fill="${g.color}" fill-opacity=".55"/>`);
    if(g.curve&&g.curve.length)s+=`<path d="${g.curve.filter(p=>p[0]<=xmax&&p[1]<=ymax).map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("")}" fill="none" stroke="${g.color}" stroke-width="2.2"/>`});
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Alan ve ağırlık ilişkisi">${s}</svg>`;
}
async function imageCanvas(src){const r=await fetch(src);if(!r.ok)throw new Error("Fotoğraf alınamadı");const bm=await createImageBitmap(await r.blob());const c=document.createElement("canvas");const s=Math.min(1,1600/Math.max(bm.width,bm.height));c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return c}
async function recomputeAreas(){
  if(!ST.config.calib?.pxPerCm){toast("Önce kalibrasyon yap");return}
  let done=0,fail=0;const jobs=[];
  birdList().forEach(b=>days().forEach(d=>{const w=b.weeks?.["d"+d];if(w?.top&&!/^demo:/.test(w.top))jobs.push([b,d,w.top])}));
  if(!jobs.length){toast("Üstten çekilmiş fotoğraf yok");return}
  const byBird={};
  for(const [b,d,ref] of jobs){
    toast(`Alanlar hesaplanıyor ${done+fail+1}/${jobs.length}`,8000);
    try{const seg=segmentBird(await imageCanvas(photoSrc(ref)));const a=areaCm2(seg);if(a){(byBird[b.id]=byBird[b.id]||{})["d"+d]={area:Math.round(a*10)/10,areaPx:Math.round(seg.px)};done++}else fail++}catch(e){fail++}
  }
  for(const [id,weeks] of Object.entries(byBird))await Store.patch("birds/"+id,{weeks});
  toast(`${done} fotoğrafın alanı hesaplandı${fail?`, ${fail} fotoğraf okunamadı`:""}`,5000);render();
}

function viewAnaliz(){

  const gom=gs.map(g=>{const bs=birdList().filter(b=>b.geno===g);const pooled=fitGompertz(bs.flatMap(birdPts));const ind=bs.map(birdGomp).filter(Boolean);return {g,pooled,ind}});
  const ser=[];gom.forEach(r=>{ser.push({pts:ds.map(d=>[d,genoMeans(r.g,d)]),color:colOf(r.g),dots:1,wd:0.01});if(r.pooled)ser.push({pts:gompCurve(r.pooled,0,x1),color:colOf(r.g),wd:2.2})});
  const ms=(arr,k,dg)=>{const a=arr.map(f=>f[k]);return a.length?`${fmt(mean(a),dg)} ± ${fmt(sd(a),dg)}`:"—"};

      ${ser.some(s=>s.pts.some(p=>p[1]!=null))?lineChart({series:ser})+`<div class="legend">${gs.map(g=>`<span><i style="border-color:${colOf(g)}"></i>${esc(gname(g))}: noktalar günlük ortalama, çizgi Gompertz</span>`).join("")}</div>`:`<div class="empty">Tartımlar girildikçe eğriler burada çizilecek.</div>`}
      <div class="tablewrap"><table class="t"><thead><tr><th>Genotip</th><th>Uydurma</th><th class="n">n</th><th class="n">A (g)</th><th class="n">k (1/gün)</th><th class="n">ti (gün)</th><th class="n">Wi (g)</th><th class="n">Maks. hız (g/gün)</th><th class="n">R²</th></tr></thead><tbody>
      ${gom.map(r=>`<tr><td><b>${esc(gname(r.g))}</b></td><td>Tüm tartımlar</td><td class="n">${r.pooled?r.pooled.n:0}</td><td class="n">${r.pooled?fmt(r.pooled.A):"—"}</td><td class="n">${r.pooled?fmt(r.pooled.k,4):"—"}</td><td class="n">${r.pooled?fmt(r.pooled.ti,1):"—"}</td><td class="n">${r.pooled?fmt(r.pooled.Wi):"—"}</td><td class="n">${r.pooled?fmt(r.pooled.MGR,1):"—"}</td><td class="n">${r.pooled?fmt(r.pooled.r2,3):"—"}</td></tr>
        <tr><td></td><td>Bireylerin ort. ± SS</td><td class="n">${r.ind.length}</td><td class="n">${ms(r.ind,"A",0)}</td><td class="n">${ms(r.ind,"k",4)}</td><td class="n">${ms(r.ind,"ti",1)}</td><td class="n">${ms(r.ind,"Wi",0)}</td><td class="n">${ms(r.ind,"MGR",1)}</td><td class="n">${ms(r.ind,"r2",3)}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="ref">Tartımlar 42. günde bittiği için A ve ti eğrinin dışına uzatılarak tahmin edilir; genotipleri karşılaştırırken k, ti ve maksimum büyüme hızını öne çıkar. Birey parametreleri Excel'deki "Gompertz" sayfasında, istatistik testi için hazır.</p>
    </div>

      <p class="small muted">Üstten fotoğrafta bireyin kapladığı alan (cm²) ölçülür ve ln(ağırlık) = a + b · ln(alan) modeli genotip başına kurulur (Küçüktopçu ve ark. 2025). Fotoğraflar hep aynı yükseklikten, tek renk zeminde çekilmelidir.</p>
      <div class="row"><span class="pill ${cal?.pxPerCm?"ok":"warn"}">${cal?.pxPerCm?`Kalibrasyon: ${fmt(num(cal.pxPerCm),1)} piksel/cm · ${esc(trDate(cal.date))}`:"Kalibrasyon yapılmadı"}</span>

      ${ar.some(r=>r.pairs.length)?scatterChart({groups:ar.map(r=>({pts:r.pairs.map(p=>[p.a,p.y]),color:colOf(r.g),curve:r.fit?Array.from({length:60},(_,i)=>{const a=amax*(i+1)/60;return [a,Math.exp(r.fit.a+r.fit.b*Math.log(a))]}):null})),xLabel:"alan (cm²)",yLabel:"ağırlık (g)"})+`<div class="legend">${gs.map(g=>`<span><i style="border-color:${colOf(g)}"></i>${esc(gname(g))}</span>`).join("")}</div>`:`<div class="empty">Alanı ölçülmüş ve tartılmış fotoğraf yok. Kalibrasyondan sonra çekilen üstten fotoğrafların alanı otomatik ölçülür.</div>`}

      ${[...ar.map(r=>[gname(r.g),r.fit]),["Tüm bireyler",all]].map(([nm,f])=>`<tr><td><b>${esc(nm)}</b></td><td class="n">${f?`${f.n} (${f.birds})`:"—"}</td><td class="n">${f?fmt(f.a,3):"—"}</td><td class="n">${f?fmt(f.b,3):"—"}</td><td class="n">${f?fmt(f.r2,3):"—"}</td><td class="n">${f?fmt(f.rmse,0):"—"}</td><td class="n">${f?fmt(f.mape,1):"—"}</td><td class="n">${f&&f.cvMape!=null?fmt(f.cvMape,1):"—"}</td></tr>`).join("")}

      <p class="ref">Çapraz doğrulamada bireyler 5 gruba ayrılır; model, test grubundaki bireyleri hiç görmeden kurulur. Genotip modellerinin b eğimleri belirgin farklıysa, tek ortak model diğer genotipte ağırlığı sistematik olarak kaydırır; yan makalenin ana sorusu budur.</p>
    </div>
  </section>`;
}

function heroSVG(cls="hero",h=210){
  const W=420,x0=40,x1=W-40,y0=h-40,y1=34,ds=[0,7,14,21,28,35,42];
  const f=t=>Math.exp(-Math.exp(-0.11*(t-26))),f0=f(0),f42=f(42);
  const X=t=>x0+(x1-x0)*t/42,Y=t=>y0-(y0-y1)*(f(t)-f0)/(f42-f0);
  let d="";for(let t=0;t<=42;t++)d+=(t?"L":"M")+X(t).toFixed(1)+","+Y(t).toFixed(1);
  const grid=ds.map(t=>`<path d="M${X(t).toFixed(1)} ${y1-12}V${y0}"/>`).join("")+[0,1,2,3].map(i=>`<path d="M${x0} ${(y0-(y0-y1)*i/3).toFixed(1)}H${x1}"/>`).join("");
  return `<svg class="${cls}" viewBox="0 0 ${W} ${h}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bireysel büyüme eğrisi">
  <defs>
    <linearGradient id="kBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d2e21"/><stop offset="1" stop-color="#1f6b4f"/></linearGradient>
    <linearGradient id="kArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <radialGradient id="kGlow" cx=".88" cy=".05" r=".65"><stop offset="0" stop-color="#e9c46a" stop-opacity=".22"/><stop offset="1" stop-color="#e9c46a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="${W}" height="${h}" fill="url(#kBg)"/><rect width="${W}" height="${h}" fill="url(#kGlow)"/>
  <g stroke="#fff" stroke-opacity=".08" stroke-width="1">${grid}</g>
  <path d="${d}L${X(42)},${y0}L${X(0)},${y0}Z" fill="url(#kArea)"/>
  <path class="curve" d="${d}" pathLength="1" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  ${ds.slice(0,-1).map(t=>`<circle cx="${X(t).toFixed(1)}" cy="${Y(t).toFixed(1)}" r="3.4" fill="#123d2c" stroke="#fff" stroke-width="1.6"/>`).join("")}
  <circle cx="${X(42).toFixed(1)}" cy="${Y(42).toFixed(1)}" r="10" fill="#e9c46a" fill-opacity=".22"/><circle cx="${X(42).toFixed(1)}" cy="${Y(42).toFixed(1)}" r="5" fill="#e9c46a"/>
  <g fill="#fff" fill-opacity=".55" font-family="Noto Sans, system-ui, sans-serif" font-size="9.5">${ds.map(t=>`<text x="${X(t).toFixed(1)}" y="${y0+16}" text-anchor="middle">${t}</text>`).join("")}<text x="${x1}" y="${y0+29}" text-anchor="end" fill-opacity=".4">gün</text></g>
  </svg>`;
}

    const rows=[];

    if(cw!=null&&pw!=null)rows.push(["Önceki tartımdan",`<span class="gain">+${fmt(cw-pw)} g</span> (${fmt((cw-pw)/(d-pd),1)} g/gün)`]);
    if(cw!=null&&pen)rows.push(["Kümes ortalaması",fmt(pen)+" g"]);
    ex.forEach(m=>{const v=w[m.k];if(v!==undefined&&v!==""&&v!=null)rows.push([flabel(m),esc(v)])});
    return `<article class="wk" style="animation-delay:${Math.min(i,6)*60}ms">
      <a class="wk-photo" ${w.top?`href="${esc(photoSrc(w.top))}" target="_blank" rel="noopener"`:""}>${w.top?imgTag(w.top,b.id+" "+d+". gün"):"fotoğraf yok"}</a>
      <div class="stack" style="gap:8px"><div><div class="wk-day">${d}. gün</div><div class="small muted">${esc(trDate(w.date))}</div></div>
        <dl class="kv">${rows.map(r=>`<dt>${esc(r[0])}</dt><dd>${r[1]}</dd>`).join("")}</dl>
        ${w.side?`<a class="wk-side" href="${esc(photoSrc(w.side))}" target="_blank" rel="noopener">${imgTag(w.side,"yandan")}</a>`:""}
      </div></article>`}).join("");
  const ws=ds.map(d=>[d,wOf(b,d)]).filter(x=>x[1]!=null);
  const first=ws[0],last=ws[ws.length-1];
  const own=ds.map(x=>[x,wOf(b,x)]),pm=ds.map(x=>[x,mean(penBirds(b.pen).map(y=>wOf(y,x)))]);
  const pl=last?mean(penBirds(b.pen).map(x=>wOf(x,last[0]))):null;
  const k=[];
  if(first)k.push([`Başlangıç (${first[0]}. gün)`,fmt(first[1])+" g"]);
  if(last&&last!==first)k.push([`Son tartım (${last[0]}. gün)`,fmt(last[1])+" g"]);
  if(first&&last&&last!==first){k.push(["Toplam artış",fmt(last[1]-first[1])+" g"]);k.push(["Ortalama günlük artış",fmt((last[1]-first[1])/(last[0]-first[0]),1)+" g/gün"])}
  if(last&&pl)k.push(["Kümes ortalamasına göre",(last[1]>=pl?"+":"")+fmt((last[1]/pl-1)*100,1)+" %"]);
  return `<div class="row"><button class="btn ghost" id="back">← ${ST.curPen?"Kümes "+ST.curPen:"Tüm bireyler"}</button></div>
  <section class="card stack"><div class="row" style="gap:10px"><span class="tag xl ${esc(g)}">${esc(b.id)}</span>${penBig(b)}</div>
    <div class="row small"><b>${esc(gname(g))}</b><span>Kümes ${esc(b.pen)}</span><span>Cinsiyet: ${esc(b.sex||"belirsiz")}</span><span class="pill ${st==="aktif"?"ok":st==="öldü"?"bad":""}">${esc(st)}</span></div></section>
  ${rec.length?`<div class="timeline">${items}</div>`:`<div class="empty">Bu birey için henüz tartım ya da fotoğraf girilmedi.</div>`}
  <section class="card stack"><h3>Genel bilgiler</h3>
    ${k.length?`<div class="kpis">${k.map(x=>`<div class="kpi"><div class="v">${esc(x[1])}</div><div class="l">${esc(x[0])}</div></div>`).join("")}</div>`:""}
    ${ws.length>1?lineChart({series:[{pts:pm,color:mut,dash:"6 4"},{pts:own,color:col,dots:1,wd:2.5}]})+`<div class="legend"><span><i style="border-color:${col}"></i>${esc(b.id)}</span><span><i style="border-color:${mut};border-top-style:dashed"></i>Kümes ${esc(b.pen)} ortalaması</span></div>`:""}
  </section>
  ${roSections(b)}`;
}
function viewVisitorPen(p){
  const bs=penBirds(p),g=penGeno(p),st=penStats(p),last=[...st].reverse().find(r=>r.n),cf=[...st].reverse().find(r=>r.cfcr!=null);
  const colOf=x=>cssv(x==="AT"?"--at":x==="RS"?"--rs":"--accent"),mut=cssv("--muted"),gs=Object.keys(G()),ds=days();

  const series=[...gs.filter(x=>x!==g).map(x=>({pts:ds.map(d=>[d,genoMeans(x,d)]),color:colOf(x),dash:"6 4",wd:1.6})),{pts:ds.map(d=>[d,genoMeans(g,d)]),color:mut,dash:"2 4",wd:1.6},{pts:st.map(r=>[r.d,r.mean]),color:colOf(g),dots:1,wd:2.6}];

  if(cf)k.push([`Yemden yararlanma (FCR, ${cf.d}. gün)`,fmt(cf.cfcr,2)]);
  return `<div class="row"><button class="btn ghost" id="back">← Tüm bireyler</button></div>

    ${last?lineChart({series})+`<div class="legend"><span><i style="border-color:${colOf(g)}"></i>Kümes ${p}</span><span><i style="border-color:${mut};border-top-style:dotted"></i>Tüm ${esc(gname(g))} ortalaması</span>${gs.filter(x=>x!==g).map(x=>`<span><i style="border-color:${colOf(x)};border-top-style:dashed"></i>${esc(gname(x))} ortalaması</span>`).join("")}</div>`:`<p class="muted">Bu kümeste henüz tartım yapılmadı.</p>`}
  </section>

  <div class="vlist">${bs.map((b,i)=>{const ph=lastPhoto(b),lw=lastW(b);return `<button class="vcard" data-open="${esc(b.id)}" style="animation-delay:${Math.min(i,8)*30}ms"><div class="ph">${ph?imgTag(ph,b.id):"fotoğraf yok"}</div><span class="tag ${esc(b.geno)}" style="align-self:flex-start">${esc(b.id)}${pk(b)}</span><span class="small muted">${lw?`${lw[0]}. gün: ${fmt(lw[1])} g`:"tartım yok"}</span></button>`}).join("")||`<div class="empty">Bu kümese henüz birey atanmadı.</div>`}</div>`;
}

function demoPhoto(ref){
  const [,id,d]=ref.split(":");const b=ST.birds[id];if(!b)return "";const w=wOf(b,Number(d))||50;const s=Math.sqrt(w/3200);
  const rx=Math.round(18+70*s),ry=Math.round(13+46*s),col=b.geno==="AT"?"#c9a25a":"#f2efe6";
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150"><rect width="200" height="150" fill="#2c6e9e"/><rect x="8" y="8" width="22" height="22" fill="#fff"/><rect x="12" y="12" width="14" height="14" fill="#000"/><ellipse cx="100" cy="78" rx="${rx}" ry="${ry}" fill="${col}"/><circle cx="${100+rx*0.95}" cy="74" r="${Math.round(6+12*s)}" fill="${col}"/><text x="8" y="142" font-family="sans-serif" font-size="11" fill="#fff">${id} · ${d}. gün</text></svg>`;
  return "data:image/svg+xml,"+encodeURIComponent(svg);
}
function exitDemo(){ST.canWrite=ST._prevMode==="local"||!!ST.session;ST.mode=ST._prevMode;ST.birds=ST._prev.birds;ST.pens=ST._prev.pens;ST.config=ST._prev.config;ST.rna=ST._prev.rna;DEG=null;setView("okut")}
function loadDemo(){
  if(ST.mode!=="demo"){ST._prev={birds:ST.birds,pens:ST.pens,config:ST.config,rna:ST.rna};ST._prevMode=ST.mode}
  const rnd=(()=>{let s=42;return()=>{s=(s*16807)%2147483647;return s/2147483647}})();
  const gauss=()=>{let u=0;for(let i=0;i<6;i++)u+=rnd();return u-3};
  const curve={RS:[42,195,540,1080,1750,2450,3150],AT:[40,165,440,880,1420,2050,2760]};
  const birds={},pens={},ds=DAYS_DEFAULT,start=new Date();start.setDate(start.getDate()-42);
  const iso=d=>{const x=new Date(start);x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)};
  [["RS",[1,2,3]],["AT",[4,5,6]]].forEach(([g,ps])=>{let k=0;ps.forEach(p=>{for(let i=0;i<40;i++){k++;const id=g+String(k).padStart(3,"0");const sex=rnd()<0.5?"erkek":"dişi";const f=1+gauss()*0.06+(sex==="erkek"?0.05:-0.05);
    const b={id,geno:g,pen:p,sex,status:"aktif",wing:String(1000+(g==="RS"?0:200)+k),weeks:{}};
    const dieAt=rnd()<0.035?ds[1+Math.floor(rnd()*5)]:null;
    ds.forEach((d,j)=>{if(dieAt!=null&&d>=dieAt)return;const w=Math.round(curve[g][j]*f*(1+gauss()*0.015));
      const wk={w:String(w),area:String(Math.round(0.95*Math.pow(w,(g==="RS"?0.70:0.73))*(1+gauss()*0.04)*10)/10),date:iso(d),band:d===14?"Değiştirildi":"Uygun",top:"demo:"+id+":"+d,shankLen:String(Math.round((22+d*1.6)*(g==="RS"?1.05:1))),shankDia:(4.5+d*0.22*(g==="RS"?1.1:1)).toFixed(1),backLen:(5+d*0.33).toFixed(1),backWid:(3+d*0.2*(g==="RS"?1.12:1)).toFixed(1)};
      if(d>=28){wk.gait=String(Math.min(5,Math.max(0,Math.round((g==="RS"?1.4:0.7)+gauss()*0.8))));wk.fpd=String(Math.min(4,Math.max(0,Math.round((g==="RS"?1:0.5)+gauss()*0.7))));wk.hock=String(Math.max(0,Math.round(0.3+gauss()*0.5)))}
      b.weeks["d"+d]=wk});
    if(dieAt!=null){b.status="öldü";b.deathDay=dieAt-1-Math.floor(rnd()*5);b.deathW=Math.round(curve[g][ds.indexOf(dieAt)-1]*f*1.1)}
    else if(i<10){const fw=Math.round(num(b.weeks.d42.w)*0.97),hc=Math.round(fw*(g==="RS"?0.735:0.715)*(1+gauss()*0.01)),pm=Math.round(hc*(g==="RS"?0.245:0.215)*(1+gauss()*0.04));
      b.status="kesildi";b.slaughter={date:iso(42),fastedW:String(fw),hotCarc:String(hc),pmaj:String(pm),pmin:String(Math.round(pm*0.21)),thighR:String(Math.round(hc*0.15)),thighL:String(Math.round(hc*0.15)),abdFat:String(Math.round(fw*(g==="RS"?0.015:0.019)))};
      const d1=25+rnd()*4;b.meat={ph15:(6.3+gauss()*0.08).toFixed(2),phu:((g==="RS"?5.95:5.85)+gauss()*0.06).toFixed(2),L:((g==="RS"?55:52)+gauss()*1.5).toFixed(1),a:(2.5+gauss()*0.6).toFixed(1),b:(11+gauss()*1.2).toFixed(1),dm1:d1.toFixed(2),dm2:(d1*(1-((g==="RS"?0.02:0.015)+rnd()*0.008))).toFixed(2),ws:String(g==="RS"?[0,0.5,1,1,1.5][Math.floor(rnd()*5)]:[0,0,0.5,1][Math.floor(rnd()*4)]),wb:String(g==="RS"?[0,1,1,2][Math.floor(rnd()*4)]:[0,0,1][Math.floor(rnd()*3)])};
    }
    birds[id]=b}})});
  for(let p=1;p<=6;p++){const g=p<=3?"RS":"AT",weeks={};const fc={RS:[0,1.0,1.25,1.45,1.6,1.72,1.82],AT:[0,1.05,1.32,1.55,1.72,1.86,1.98]}[g];
    ds.forEach((d,j)=>{if(!j)return;const ms=Object.values(birds).filter(b=>b.pen===p);const m1=mean(ms.map(b=>wOf(b,d))),m0=mean(ms.map(b=>wOf(b,ds[j-1])));const gain=(m1-m0)*ms.filter(b=>wOf(b,d)!=null).length/1000;weeks["d"+d]={feed:(gain*fc[j]*1.02+0.4).toFixed(1),left:"0.4",temp:String(33-j*2),rh:String(55+j)}});
    pens["B"+p]={pen:p,geno:g,weeks}}
  ST.mode="demo";ST.birds=birds;ST.pens=pens;ST.config=deepMerge(clone(CONFIG_DEFAULT),{startDate:iso(0),trial:"ÖRNEK · Anadolu-T × Ross 308",calib:{pxPerCm:20,longSide:1600,date:iso(0)}});ST.rna={};DEG=null;ST.loaded=true;
  if(!ST.role){ST.role="owner"}ST.canWrite=true;
  toast("Örnek veri yüklendi");setView("okut");
}
